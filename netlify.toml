[build]
  command = "npm run build"
  publish = "dist/emar-cocinas/browser"

[build.environment]
  NODE_VERSION = "20"

# Canonical: https://www.cocinasemar.com
[[redirects]]
  from = "https://cocinasemar.com/*"
  to = "https://www.cocinasemar.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://cocinasemar.com/*"
  to = "https://www.cocinasemar.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.cocinasemar.com/*"
  to = "https://www.cocinasemar.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
